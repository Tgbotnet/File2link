<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{file_name}} &middot; My File 2 Link</title>

    <meta property="og:site_name" content="My File 2 Link">
    <meta property="og:title" content="{{file_name}}">
    <meta property="og:description" content="Download {{file_name}} ({{file_size}}) instantly.">
    <meta property="og:image" content="{{ server_url }}/logo.png">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0B0F14">

    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/base.css">

    <style>
        main { display: flex; align-items: center; justify-content: center; }
        .card {
            width: 100%;
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 18px 44px rgba(0, 0, 0, .40);
        }
        .file-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: rgba(39, 131, 222, 0.14);
            border: 1px solid rgba(39, 131, 222, 0.30);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-soft);
            margin-bottom: 20px;
        }
        .file-title {
            margin: 8px 0 0;
            font-size: 21px;
            font-weight: 650;
            letter-spacing: -0.015em;
            line-height: 1.32;
            word-break: break-word;
        }
        .card .actions { margin-top: 24px; grid-template-columns: 1fr; }
        @media (max-width: 640px) { .card { padding: 24px 20px; } .file-title { font-size: 19px; } }
    </style>
</head>

<body>
<div class="shell">

    <header>
        <div class="header-inner">
            <a class="brand" href="https://t.me/My_file_2_link_bot">
                <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect width="32" height="32" rx="9" fill="#2783DE"/>
                    <path d="M13.4 19.6l5.2-5.2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M15.1 11.9l1.6-1.6a3.6 3.6 0 015.1 5.1l-1.6 1.6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M16.9 20.1l-1.6 1.6a3.6 3.6 0 01-5.1-5.1l1.6-1.6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>
                    <span class="brand-name">My File 2 Link</span>
                    <span class="brand-by">by Mr.Aman</span>
                </span>
            </a>
            <a class="header-cta" href="https://t.me/My_file_2_link_bot">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3l-3 14.2c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-.9.5l.3-4.6L18.3 6c.4-.3-.1-.5-.6-.2L7.4 12.3l-4.5-1.4c-1-.3-1-1 .2-1.4l17.6-6.8c.8-.3 1.5.2 1.2 1.6z"/></svg>
                Open Bot
            </a>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="file-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>

            <div class="meta-label">Ready to download</div>
            <h1 class="file-title">{{file_name}}</h1>

            <div class="chips">
                <span class="chip"><span class="chip-dot"></span> Link active</span>
                <span class="chip">Size <strong>{{file_size}}</strong></span>
                <span class="chip">Resume supported</span>
            </div>

            <div class="actions">
                <a class="btn btn-primary" href="{{file_url}}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Download now<small>Direct high-speed link</small></span>
                </a>

                <button class="btn" type="button" onclick="copyLink()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/></svg>
                    <span>Copy link<small>Share it anywhere</small></span>
                </button>

                <button class="btn btn-danger" type="button" onclick="reportFile()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L2.5 17a2 2 0 001.7 3h15.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    <span>Report file<small>Abuse or copyright</small></span>
                </button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <span>&copy; 2026 <strong style="color:var(--muted)">Mr.Aman</strong> &middot; My File 2 Link</span>
            <a href="https://t.me/My_file_2_link_bot">@My_file_2_link_bot</a>
        </div>
    </footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
    var FILE_URL = new URL("{{file_url}}", window.location.href).href;
    var DB_ID = "{{ db_id }}";

    function toast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(window.__tt);
        window.__tt = setTimeout(function () { t.classList.remove('show'); }, 2600);
    }

    function copyLink() {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(FILE_URL).then(function () {
                toast('Link copied to clipboard');
            }, fallbackCopy);
        } else {
            fallbackCopy();
        }
    }

    function fallbackCopy() {
        var ta = document.createElement('textarea');
        ta.value = FILE_URL;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast('Link copied to clipboard'); }
        catch (e) { toast('Copy failed - long-press the link instead'); }
        document.body.removeChild(ta);
    }

    async function reportFile() {
        if (!confirm('Report this file for copyright infringement or a policy violation?')) return;
        try {
            var res = await fetch('/report/' + DB_ID, { method: 'POST' });
            toast(res.ok ? 'Report sent to the admin. Thank you.' : 'Could not send the report.');
        } catch (e) {
            toast('Could not send the report.');
        }
    }
</script>
</body>
</html>
