<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File unavailable &middot; My File 2 Link</title>

    <meta property="og:site_name" content="My File 2 Link">
    <meta property="og:title" content="File unavailable">
    <meta property="og:description" content="This file has been removed or the link has expired.">
    <meta property="og:image" content="/logo.png">
    <meta name="theme-color" content="#0B0F14">
    <meta name="robots" content="noindex">

    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/base.css">

    <style>
        main { display: flex; align-items: center; justify-content: center; }
        .card {
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 18px 44px rgba(0, 0, 0, .40);
        }
        .warn-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 22px;
            border-radius: 15px;
            background: rgba(233, 115, 102, 0.12);
            border: 1px solid rgba(233, 115, 102, 0.30);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--danger);
        }
        .card h1 { margin: 0 0 12px; font-size: 23px; font-weight: 680; letter-spacing: -0.02em; }
        .card p { margin: 0 auto; max-width: 40ch; font-size: 14.5px; color: var(--muted); line-height: 1.6; }
        .redirect {
            margin: 26px auto 0;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 16px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            font-size: 13px;
            font-weight: 550;
            color: var(--muted);
        }
        .redirect b { color: var(--accent-soft); font-variant-numeric: tabular-nums; }
        .card .btn { justify-content: center; margin-top: 22px; text-align: center; }
        .card .btn span { flex: none; }
        @media (max-width: 640px) { .card { padding: 28px 20px; } .card h1 { font-size: 20px; } }
    </style>
</head>

<body>
<div class="shell">

    <header>
        <div class="header-inner">
            <a class="brand" href="{{ bot_url }}">
                <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect width="32" height="32" rx="9" fill="#2783DE"/>
                    <path d="M13.4 19.6l5.2-5.2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M15.1 11.9l1.6-1.6a3.6 3.6 0 015.1 5.1l-1.6 1.6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <path d="M16.9 20.1l-1.6 1.6a3.6 3.6 0 01-5.1-5.1l1.6-1.6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>
                    <span class="brand-name">My File 2 Link</span>
                    <span class="brand-by">by Mr.Aman</span>
                </span>
            </a>
            <a class="header-cta" href="{{ bot_url }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3l-3 14.2c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-.9.5l.3-4.6L18.3 6c.4-.3-.1-.5-.6-.2L7.4 12.3l-4.5-1.4c-1-.3-1-1 .2-1.4l17.6-6.8c.8-.3 1.5.2 1.2 1.6z"/></svg>
                Open Bot
            </a>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="warn-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L2.5 17a2 2 0 001.7 3h15.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>

            <h1>This file is no longer available</h1>
            <p>
                The link you followed has expired, was revoked by its owner, or the file was
                removed after a copyright or policy report.
            </p>

            <div class="redirect">
                <span class="chip-dot" style="background:var(--accent-soft)"></span>
                Redirecting to the bot in <b id="timer">5</b>s
            </div>

            <a class="btn btn-primary" href="{{ bot_url }}">
                <span>Go to the bot now</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <span>&copy; 2026 <strong style="color:var(--muted)">Mr.Aman</strong> &middot; My File 2 Link</span>
            <a href="{{ bot_url }}">@My_file_2_link_bot</a>
        </div>
    </footer>
</div>

<script>
    var left = 5;
    var el = document.getElementById('timer');
    var iv = setInterval(function () {
        left -= 1;
        if (left > 0) {
            el.textContent = left;
        } else {
            clearInterval(iv);
            el.textContent = '0';
            window.location.href = "{{ bot_url }}";
        }
    }, 1000);
</script>
</body>
</html>
